server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Scripts only from this site (the one inline line in index.html by its hash), styles and fonts from Google Fonts,
  # pictures and API calls to the backends (local ports in development, HTTPS once deployed), no plugins, no framing.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WZRJfWvsnNCPcxzZwvyhovnZGqhZaC+8gPGPRbx6wTk='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Hashed build files never change, so cache them for good; index.html is always revalidated.
  location /assets/ {
    expires max;
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
